<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Goal Overlay — StreamKit</title>
  <link rel="stylesheet" href="../../../assets/styles/overlay.css">
  <script src="../../../assets/js/util.js"></script>
  <style>
    body { padding: 10px; }
    .goals-stack { display: flex; flex-direction: column; gap: 10px; }
    .goal-block  { display: flex; flex-direction: column; gap: 4px; min-width: 200px; }
    .goal-header-row {
      display: flex; align-items: baseline;
      justify-content: space-between; gap: 8px;
    }
    .goal-name {
      font-size: 15px; font-weight: 700;
      color: rgba(255,255,255,0.9);
      text-shadow: 1px 1px 3px rgba(0,0,0,0.95);
    }
    .goal-nums {
      font-size: 20px; font-weight: 800; color: #fff;
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000,
                   0 0 10px rgba(0,0,0,0.9);
      white-space: nowrap;
    }
    .goal-bar-track {
      width: 100%; height: 12px;
      background: rgba(0,0,0,0.5);
      border-radius: 6px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .goal-bar-fill {
      height: 100%; border-radius: 6px;
      transition: width 0.5s ease, background 0.3s ease;
    }
    .goal-bar-fill.done { box-shadow: 0 0 10px currentColor; }
    .goal-pct {
      font-size: 12px; color: rgba(255,255,255,0.7);
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="goals-stack" id="stack"></div>

  <script>
    const KEY       = 'streamkit_goals';
    const STYLE_KEY = 'streamkit_overlay_goals';
    const STATS_KEY = 'streamkit_live_stats';

    const DEFAULTS  = { font: 'system', colorBar: '#2fd4a9', colorComplete: '#2ecc71' };
    const SRC_FIELD = { follows: 'sessionFollows', subs: 'sessionSubs', bits: 'sessionBits', raids: 'sessionRaids' };

    function getStyle() {
      try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem(STYLE_KEY)) }; }
      catch (e) { return { ...DEFAULTS }; }
    }
    function liveStats() { try { return JSON.parse(localStorage.getItem(STATS_KEY)) || {}; } catch (e) { return {}; } }
    function currentOf(g, ls) {
      if (g.source && g.source !== 'manual') return Math.max(0, parseInt(ls[SRC_FIELD[g.source]]) || 0);
      return Math.max(0, parseInt(g.current) || 0);
    }

    function mk(tag, attrs, kids) {
      const n = document.createElement(tag);
      if (attrs) for (const k in attrs) {
        if (k === 'class') n.className = attrs[k];
        else if (k === 'text') n.textContent = attrs[k];
        else if (k === 'style') n.style.cssText = attrs[k];
        else n.setAttribute(k, attrs[k]);
      }
      (kids || []).forEach(c => { if (c) n.appendChild(c); });
      return n;
    }

    function update() {
      const s = getStyle();
      document.body.style.fontFamily = StreamKit.FONT_CSS[s.font] || StreamKit.FONT_CSS.system;

      let goals = [];
      try { goals = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { goals = []; }
      const ls = liveStats();

      const stack = document.getElementById('stack');
      stack.replaceChildren();

      goals.forEach(g => {
        const cur = currentOf(g, ls);
        const pct = g.target > 0 ? Math.min(100, Math.round((cur / g.target) * 100)) : 0;
        const complete = cur >= g.target;
        const barColor = complete ? s.colorComplete : s.colorBar;

        const fill = mk('div', { class: 'goal-bar-fill' + (complete ? ' done' : ''), style: `width:${pct}%;background:${barColor};color:${barColor}` });
        const track = mk('div', { class: 'goal-bar-track' }, [fill]);
        const header = mk('div', { class: 'goal-header-row' }, [
          mk('span', { class: 'goal-name', text: g.label }),
          mk('span', { class: 'goal-nums', text: `${cur} / ${g.target}` }),
        ]);
        const pctEl = mk('div', { class: 'goal-pct', text: pct + '%' + (complete ? ' 🎉' : '') });
        stack.appendChild(mk('div', { class: 'goal-block' }, [header, track, pctEl]));
      });
    }

    update();
    setInterval(update, 2000);
  </script>
</body>
</html>
