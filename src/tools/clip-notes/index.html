<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clip Notes — StreamKit</title>
  <link rel="stylesheet" href="../../../assets/styles/dashboard.css">
  <script src="../../../assets/js/util.js"></script>
  <style>

    /* Twitch clip button */
    .twitch-clip-btn {
      display: none;
      align-items: center;
      gap: 7px;
      padding: 10px 18px;
      background: rgba(145,71,255,0.12);
      border: 1px solid rgba(145,71,255,0.35);
      border-radius: 8px;
      color: #9147ff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .twitch-clip-btn.visible { display: flex; }
    .twitch-clip-btn:hover { background: rgba(145,71,255,0.22); }
    .twitch-clip-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .clip-result-toast {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(46,204,113,0.12);
      border: 1px solid rgba(46,204,113,0.3);
      border-radius: 8px;
      font-size: 13px;
      color: var(--green);
      margin-top: 8px;
    }
    .clip-result-toast.show { display: flex; }
    .clip-result-toast a { color: var(--green); font-weight: 700; }

    .mark-section { margin-bottom: 20px; }

    .tag-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .tag-preset {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 2px solid transparent;
      background: var(--bg3);
      color: var(--muted);
      transition: all 0.15s;
    }
    .tag-preset:hover { border-color: var(--border); color: var(--text); }
    .tag-preset.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .mark-controls { display: flex; gap: 8px; margin-bottom: 8px; }
    .mark-controls input { flex: 1; }

    .mark-btn {
      width: 100%;
      padding: 28px 20px;
      font-size: 22px;
      border-radius: 12px;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
    }
    .mark-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      transition: opacity 0.1s;
    }
    .mark-btn:active::after { opacity: 0.15; }

    .session-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--muted);
    }
    .session-info strong { color: var(--text); }

    .clips-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .clips-header-actions { display: flex; gap: 8px; }

    .clips-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 400px;
      overflow-y: auto;
    }

    .clip-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      background: var(--bg3);
      border-radius: 8px;
      border: 1px solid transparent;
      transition: border-color 0.15s;
      animation: pop-in 0.2s ease;
    }
    .clip-item:hover { border-color: var(--border); }

    .clip-time {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      min-width: 48px;
    }
    .clip-tag {
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .clip-note { flex: 1; font-size: 14px; color: var(--text); }
    .clip-absolute { font-size: 11px; color: var(--muted); white-space: nowrap; }

    .clip-del {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      opacity: 0;
      transition: opacity 0.15s;
      padding: 0 4px;
      line-height: 1;
    }
    .clip-item:hover .clip-del { opacity: 1; }
    .clip-del:hover { color: var(--red); }

    .empty-state { text-align: center; padding: 40px; color: var(--muted); font-size: 15px; }

    .tag-colors {
      funny:    '#f0a500',
      hype:     '#2ecc71',
      rage:     '#e74c3c',
      clip:     '#2fd4a9',
      moment:   '#3498db',
      fail:     '#e67e22'
    }

    /* flash feedback */
    @keyframes mark-flash {
      0%   { transform: scale(1); }
      30%  { transform: scale(0.97); }
      60%  { transform: scale(1.02); }
      100% { transform: scale(1); }
    }
    .mark-btn.flashed { animation: mark-flash 0.3s ease; }
  </style>
</head>
<body class="tool-page tool-page-flush">
  <header class="tool-header">
    <div class="tool-heading">
      <div class="tool-eyebrow"><span class="sk-mark" aria-hidden="true"><span></span><span></span><span></span></span> StreamKit · Capture</div>
      <h1 class="tool-title">Clip Notes</h1>
    </div>
    <div class="header-actions">
      <button class="twitch-clip-btn" id="twitchClipBtn" onclick="createTwitchClip()">Create Twitch Clip</button>
    </div>
  </header>
  <div class="clip-result-toast" id="clipToast">
    ✅ Clip created! <a id="clipLink" href="#" target="_blank">View clip ↗</a>
  </div>

  <div class="mark-section card">
    <div class="tag-row" id="tagRow">
      <span style="color:var(--muted);font-size:13px;align-self:center">Tag:</span>
      <!-- presets injected by JS -->
    </div>
    <div class="mark-controls">
      <input type="text" id="tagInput" placeholder="Custom tag" maxlength="20">
      <input type="text" id="noteInput" placeholder="Quick note (optional)" maxlength="120">
    </div>
    <button class="btn btn-primary mark-btn" id="markBtn" onclick="markClip()">📌 MARK CLIP</button>
  </div>

  <div class="session-info mt-16">
    <span>Session started: <strong id="sessionStart">—</strong></span>
    <span id="clipCount" style="font-weight:700;color:var(--text)">0 clips</span>
  </div>

  <div class="clips-header">
    <h3>This Session</h3>
    <div class="clips-header-actions">
      <button class="btn btn-ghost btn-sm" onclick="exportClips()">📋 Export</button>
      <button class="btn btn-ghost btn-sm" style="color:var(--muted)" onclick="clearSession()">Clear</button>
    </div>
  </div>

  <div class="clips-list" id="clipsList">
    <div class="empty-state" id="emptyState">No clips yet — hit MARK CLIP during the action!</div>
  </div>

  <script>
    const KEY = 'streamkit_clipnotes';
    const TAG_COLORS = {
      funny:  { bg: 'rgba(240,165,0,0.15)',   color: '#f0a500' },
      hype:   { bg: 'rgba(46,204,113,0.15)',   color: '#2ecc71' },
      rage:   { bg: 'rgba(231,76,60,0.15)',    color: '#e74c3c' },
      clip:   { bg: 'rgba(47,212,169,0.15)',  color: '#2fd4a9' },
      moment: { bg: 'rgba(52,152,219,0.15)',   color: '#3498db' },
      fail:   { bg: 'rgba(230,126,34,0.15)',   color: '#e67e22' },
    };
    const TAG_PRESETS = Object.keys(TAG_COLORS);

    let clips = [];
    let sessionStart = null;
    let activeTag = '';

    function fmtTime(ms) {
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      const h = Math.floor(m / 60);
      return h > 0
        ? `${h}:${pad(m%60)}:${pad(s%60)}`
        : `${pad(m)}:${pad(s%60)}`;
    }
    function pad(n) { return String(n).padStart(2,'0'); }
    function fmtWall(ts) {
      return new Date(ts).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    }

    function load() {
      try {
        const s = localStorage.getItem(KEY);
        if (s) { const d = JSON.parse(s); clips = d.clips || []; sessionStart = d.sessionStart || null; }
      } catch(e) {}
      if (!sessionStart) { sessionStart = Date.now(); save(); }
      buildTagRow();
      render();
    }

    function save() { localStorage.setItem(KEY, JSON.stringify({ clips, sessionStart })); }

    function buildTagRow() {
      const row = document.getElementById('tagRow');
      // keep the label span
      const label = row.querySelector('span');
      row.innerHTML = '';
      row.appendChild(label);
      TAG_PRESETS.forEach(tag => {
        const btn = document.createElement('span');
        btn.className = 'tag-preset' + (activeTag === tag ? ' active' : '');
        btn.textContent = tag;
        btn.onclick = () => toggleTag(tag);
        row.appendChild(btn);
      });
    }

    function toggleTag(tag) {
      activeTag = activeTag === tag ? '' : tag;
      buildTagRow();
      document.getElementById('tagInput').value = '';
    }

    function markClip() {
      const now = Date.now();
      const customTag = document.getElementById('tagInput').value.trim();
      const tag = customTag || activeTag;
      const note = document.getElementById('noteInput').value.trim();

      clips.unshift({
        id: uid(),
        timestamp: now,
        elapsed: now - sessionStart,
        tag,
        note
      });

      document.getElementById('noteInput').value = '';
      if (customTag) { document.getElementById('tagInput').value = ''; activeTag = ''; }

      save();
      render();

      // feedback flash
      const btn = document.getElementById('markBtn');
      btn.classList.remove('flashed');
      void btn.offsetWidth;
      btn.classList.add('flashed');
    }

    function deleteClip(id) {
      clips = clips.filter(c => c.id !== id);
      save();
      render();
    }

    function clearSession() {
      if (!confirm('Clear all clips and reset session timer?')) return;
      clips = [];
      sessionStart = Date.now();
      save();
      render();
    }

    function exportClips() {
      if (!clips.length) { alert('No clips to export.'); return; }
      const lines = [
        `StreamKit Clip Notes — Session started ${new Date(sessionStart).toLocaleString()}`,
        '─'.repeat(50),
        ...clips.slice().reverse().map(c => {
          const parts = [`[${fmtTime(c.elapsed)}]`];
          if (c.tag) parts.push(`#${c.tag}`);
          if (c.note) parts.push(c.note);
          return parts.join(' ');
        })
      ];
      navigator.clipboard.writeText(lines.join('\n')).then(() => {
        const btn = document.querySelector('[onclick="exportClips()"]');
        const orig = btn.textContent;
        btn.textContent = '✅ Copied!';
        setTimeout(() => { btn.textContent = orig; }, 2000);
      }).catch(() => {
        prompt('Copy this text:', lines.join('\n'));
      });
    }

    function render() {
      document.getElementById('sessionStart').textContent = fmtWall(sessionStart);
      document.getElementById('clipCount').textContent = clips.length + (clips.length === 1 ? ' clip' : ' clips');
      document.getElementById('emptyState').style.display = clips.length ? 'none' : 'block';

      const list = document.getElementById('clipsList');
      list.querySelectorAll('.clip-item').forEach(el => el.remove());

      clips.forEach(c => {
        const colors = TAG_COLORS[c.tag] || { bg: 'rgba(47,212,169,0.15)', color: '#2fd4a9' };
        const div = document.createElement('div');
        div.className = 'clip-item';
        div.innerHTML = `
          <span class="clip-time">${fmtTime(c.elapsed)}</span>
          ${c.tag ? `<span class="clip-tag" style="background:${colors.bg};color:${colors.color}">#${esc(c.tag)}</span>` : ''}
          <span class="clip-note">${esc(c.note || '')}</span>
          <span class="clip-absolute">${fmtWall(c.timestamp)}</span>
          <button class="clip-del" onclick="deleteClip('${c.id}')" title="Delete">×</button>
        `;
        list.appendChild(div);
      });
    }

    // Keyboard shortcut: Space to mark (when not in an input)
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') { e.preventDefault(); markClip(); }
    });

    // ── Twitch clip integration ──
    function getTwitchToken()    { return localStorage.getItem('streamkit_twitch_token'); }
    function getTwitchUser()     { try { return JSON.parse(localStorage.getItem('streamkit_twitch_user')); } catch(e) { return null; } }
    function getTwitchClientId() { return localStorage.getItem('streamkit_twitch_client_id'); }

    function checkTwitchConnection() {
      const user   = getTwitchUser();
      const token  = getTwitchToken();
      const stream = (() => { try { return JSON.parse(localStorage.getItem('streamkit_stream_status')); } catch(e) { return null; } })();
      const btn    = document.getElementById('twitchClipBtn');
      // Show button only if Twitch connected AND currently live
      const isLive = stream && stream.isLive;
      btn.classList.toggle('visible', !!(user && token && isLive));
    }

    async function createTwitchClip() {
      const user     = getTwitchUser();
      const token    = getTwitchToken();
      const clientId = getTwitchClientId();
      if (!user || !token || !clientId) return;

      const btn = document.getElementById('twitchClipBtn');
      btn.disabled = true;
      btn.textContent = '⏳ Creating…';

      try {
        const res = await fetch(`https://api.twitch.tv/helix/clips?broadcaster_id=${user.id}`, {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token, 'Client-Id': clientId }
        });

        if (res.status === 401) {
          localStorage.removeItem('streamkit_twitch_token');
          btn.textContent = '⚠ Token expired';
          setTimeout(() => { btn.textContent = '🎬 Create Twitch Clip'; btn.disabled = false; }, 3000);
          return;
        }
        if (!res.ok) {
          btn.textContent = '✗ Not live?';
          setTimeout(() => { btn.textContent = '🎬 Create Twitch Clip'; btn.disabled = false; }, 3000);
          return;
        }

        const data = await res.json();
        const editUrl = data.data?.[0]?.edit_url || '';
        const clipUrl = editUrl.replace('/edit', '');

        // Auto-log the clip
        markClip();

        // Show toast
        const toast = document.getElementById('clipToast');
        document.getElementById('clipLink').href = clipUrl || editUrl;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 8000);

        btn.textContent = '✓ Clipped!';
        setTimeout(() => { btn.textContent = '🎬 Create Twitch Clip'; btn.disabled = false; }, 3000);
      } catch(e) {
        btn.textContent = '✗ Error';
        setTimeout(() => { btn.textContent = '🎬 Create Twitch Clip'; btn.disabled = false; }, 3000);
      }
    }

    // Check on load and every 30s in case stream starts/stops
    checkTwitchConnection();
    setInterval(checkTwitchConnection, 30000);

    load();
  </script>
</body>
</html>
