<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Now Playing — StreamKit</title>
  <link rel="stylesheet" href="../../../assets/styles/overlay.css">
  <script src="../../../assets/js/util.js"></script>
  <style>
    body { padding: 0; overflow: hidden; }

    .widget {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px 10px 10px;
      background: rgba(0,0,0,0.72);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(4px);
      max-width: 340px;
      transition: opacity 0.5s ease;
    }
    .widget.hidden { opacity: 0; pointer-events: none; }

    .art {
      width: 54px; height: 54px;
      border-radius: 6px; object-fit: cover;
      flex-shrink: 0; background: #222;
      transition: opacity 0.4s ease;
    }

    .info {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column; gap: 2px;
    }

    .playing-icon {
      display: flex; align-items: flex-end;
      gap: 2px; height: 14px; margin-bottom: 2px;
    }
    .bar {
      width: 3px; border-radius: 2px;
      transform-origin: bottom;
      /* background set dynamically */
    }
    .bar:nth-child(1) { animation: eq 0.9s ease infinite 0.0s; }
    .bar:nth-child(2) { animation: eq 0.9s ease infinite 0.2s; }
    .bar:nth-child(3) { animation: eq 0.9s ease infinite 0.4s; }
    .bar:nth-child(4) { animation: eq 0.9s ease infinite 0.1s; }
    @keyframes eq {
      0%, 100% { height: 4px; }
      50%       { height: 14px; }
    }
    .paused .bar { animation-play-state: paused; height: 4px; }

    .title {
      font-size: 15px; font-weight: 700; color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .artist {
      font-size: 12px; color: rgba(255,255,255,0.7);
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .progress-row {
      display: flex; align-items: center; gap: 6px; margin-top: 5px;
    }
    .progress-track {
      flex: 1; height: 3px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; border-radius: 2px;
      transition: width 1s linear;
      /* background set dynamically */
    }
    .time {
      font-size: 10px; color: rgba(255,255,255,0.5);
      white-space: nowrap; font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="widget hidden" id="widget">
    <img class="art" id="art" src="" alt="">
    <div class="info">
      <div class="playing-icon" id="eqIcon">
        <div class="bar" id="bar1"></div>
        <div class="bar" id="bar2"></div>
        <div class="bar" id="bar3"></div>
        <div class="bar" id="bar4"></div>
      </div>
      <div class="title"  id="title">—</div>
      <div class="artist" id="artist">—</div>
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" id="fill" style="width:0%"></div></div>
        <span class="time" id="time">0:00</span>
      </div>
    </div>
  </div>

  <script>
    const KEY       = 'streamkit_nowplaying';
    const STYLE_KEY = 'streamkit_overlay_spotify';

    const DEFAULTS  = { font: 'system', colorAccent: '#1db954' };

    function getStyle() {
      try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem(STYLE_KEY)) }; }
      catch(e) { return { ...DEFAULTS }; }
    }

    function applyStyle(s) {
      const fontCss = StreamKit.FONT_CSS[s.font] || StreamKit.FONT_CSS.system;
      document.body.style.fontFamily = fontCss;
      // Accent color to EQ bars and progress fill
      const bars = document.querySelectorAll('.bar');
      bars.forEach(b => b.style.background = s.colorAccent);
      document.getElementById('fill').style.background = s.colorAccent;
    }

    let lastTrackId = null;
    let localProgress = 0, localIsPlaying = false, lastSync = 0;

    function fmt(ms) {
      const s = Math.floor(ms / 1000);
      return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
    }

    function update() {
      applyStyle(getStyle());

      const raw = localStorage.getItem(KEY);
      if (!raw) { document.getElementById('widget').classList.add('hidden'); return; }
      let np;
      try { np = JSON.parse(raw); } catch(e) { return; }
      if (!np || !np.title) { document.getElementById('widget').classList.add('hidden'); return; }

      document.getElementById('widget').classList.remove('hidden');

      if (np.trackId !== lastTrackId) {
        const art = document.getElementById('art');
        art.style.opacity = '0';
        setTimeout(() => { art.src = np.albumArt || ''; art.style.opacity = '1'; }, 300);
        lastTrackId = np.trackId;
      }

      document.getElementById('title').textContent  = np.title  || '—';
      document.getElementById('artist').textContent = np.artist || '—';

      localProgress  = np.progress  || 0;
      localIsPlaying = np.isPlaying || false;
      lastSync = Date.now();

      document.getElementById('eqIcon').className = 'playing-icon' + (localIsPlaying ? '' : ' paused');
    }

    function tick() {
      if (localIsPlaying) {
        const elapsed = Date.now() - lastSync;
        const np = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (!np) return;
        const estimated = Math.min(localProgress + elapsed, np.duration || localProgress);
        const pct = np.duration > 0 ? (estimated / np.duration) * 100 : 0;
        document.getElementById('fill').style.width = pct.toFixed(1) + '%';
        document.getElementById('time').textContent = fmt(np.duration - estimated);
      }
    }

    update();
    setInterval(update, 5000);
    setInterval(tick, 1000);
  </script>
</body>
</html>
