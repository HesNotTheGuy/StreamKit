<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Connecting to Spotify…</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #f0f0f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 16px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #333;
      border-top-color: #1db954;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #888; font-size: 15px; }
    .error { color: #e74c3c; max-width: 400px; text-align: center; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <p id="msg">Connecting to Spotify…</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code  = params.get('code');
    const error = params.get('error');

    async function exchange() {
      const verifier  = sessionStorage.getItem('streamkit_spotify_pkce_verifier');
      const clientId  = localStorage.getItem('streamkit_spotify_client_id');
      const redirectUri = localStorage.getItem('streamkit_spotify_redirect_uri');

      if (error || !code) {
        showError('Spotify auth failed: ' + (error || 'no code returned'));
        return;
      }
      if (!verifier || !clientId) {
        showError('Missing OAuth state — please try connecting again.');
        return;
      }

      try {
        const res = await fetch('https://accounts.spotify.com/api/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            grant_type:    'authorization_code',
            code,
            redirect_uri:  redirectUri,
            client_id:     clientId,
            code_verifier: verifier,
          }),
        });

        const data = await res.json();
        if (data.error) { showError('Token error: ' + data.error_description); return; }

        localStorage.setItem('streamkit_spotify_tokens', JSON.stringify({
          access_token:  data.access_token,
          refresh_token: data.refresh_token,
          expires_at:    Date.now() + data.expires_in * 1000,
        }));
        sessionStorage.removeItem('streamkit_spotify_pkce_verifier');

        document.getElementById('msg').textContent = 'Connected! Redirecting…';
        setTimeout(() => { window.location.href = 'index.html'; }, 800);
      } catch (e) {
        showError('Network error during token exchange: ' + e.message);
      }
    }

    function showError(msg) {
      document.getElementById('spinner').style.display = 'none';
      const p = document.getElementById('msg');
      p.className = 'error';
      p.textContent = msg;
    }

    exchange();
  </script>
</body>
</html>
